{% extends "base.html" %}
{% block contenu %}
<h2>{{ 'Modifier le produit' if produit else 'Ajouter un produit' }}</h2>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Désignation</label>
    <input type="text" name="designation" class="form-control"
           value="{{ produit.designation if produit else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Prix de vente</label>
    <input type="number" step="0.01" min="0" name="prix_vente" class="form-control"
           value="{{ produit.prix_vente if produit else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Catégorie</label>
    <select name="id_categorie" class="form-select" required>
      {% for c in categories %}
        <option value="{{ c.id_categorie }}"
          {% if produit and produit.id_categorie == c.id_categorie %}selected{% endif %}>
          {{ c.libelle }}
        </option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-primary">Enregistrer</button>
  <a class="btn btn-secondary" href="{{ url_for('liste_produits') }}">Annuler</a>
</form>
{% endblock %}
